[project]
name = "ai-services-platform"
version = "0.1.0"
description = "Multi-provider AI services platform"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.5.0",
    "boto3>=1.34.0",
    "azure-ai-foundry>=0.1.0",
    "ollama>=0.1.0",
    "openrouter>=0.1.0",
    "ibm-watson>=6.0.0",
    "onnxruntime>=1.16.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
]

[build]
build-backend = "hatchling.build"